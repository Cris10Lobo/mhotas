name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build server
        working-directory: server
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p ../dist/mhotas-server
          go build -o ../dist/mhotas-server/mhotas-server.exe ./cmd/mhotas-server
          cp config.json ../dist/mhotas-server/
          printf '@echo off\r\ncd /d "%%~dp0"\r\nmhotas-server.exe --backend=simconnect --config=config.json\r\npause\r\n' > ../dist/mhotas-server/start-mhotas.bat
          cd ../dist && zip -r mhotas-server-${{ github.ref_name }}-windows.zip mhotas-server

      - name: Build APK
        working-directory: app
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/mhotas-${{ github.ref_name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            dist/mhotas-server-${{ github.ref_name }}-windows.zip
            dist/mhotas-${{ github.ref_name }}.apk
